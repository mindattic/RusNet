[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rusnet"
version = "0.1.0"
description = "Local-network inventory scanner that outputs a standardized JSON map and a self-contained interactive HTML report."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "MindAttic" }]
keywords = ["network", "inventory", "lan", "discovery", "scanner", "mapping"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
interfaces = ["psutil>=5.9"]
all = ["pywebview>=5.0", "psutil>=5.9"]

[project.scripts]
rusnet = "rusnet.cli:main"

[tool.setuptools]
packages = ["rusnet", "rusnet.discovery"]

[tool.setuptools.package-data]
rusnet = ["data/*.csv", "assets/*.css", "assets/*.js", "assets/components/*"]
